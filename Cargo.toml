[package]
name = "chromiacast"
version = "0.1.0"
edition = "2021"
description = "Cast streaming protocol (RTP/RTCP) for Rust"
license = "MIT"
repository = "https://github.com/pronkproject/chromiacast"
readme = "README.md"
rust-version = "1.83"
keywords = ["cast", "chromecast", "streaming", "rtp", "rtcp"]
categories = ["multimedia", "network-programming"]

[features]
default = []
android-tv = [
    "dep:base64ct",
    "dep:prost",
    "dep:rcgen",
    "dep:rsa",
    "dep:zeroize",
]
dangerous-unverified = []
discovery = ["dep:mdns-sd"]

[dependencies]
aes = "0.8"
# `spki` exposes PEM support as an optional edge which Cargo still records in
# the lockfile. Pin its codec to a release parseable by the declared MSRV.
base64ct = { version = "=1.6.0", optional = true }
bytes = "1"
ctr = "0.9"
mdns-sd = { version = "0.20.3", optional = true }
httparse = "1"
prost = { version = "0.13", optional = true }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["ring"], optional = true }
ring = "0.17"
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Newer `time` releases require a compiler newer than the crate's declared MSRV.
time = "=0.3.36"
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
x509-parser = { version = "=0.16.0", features = ["verify"] }
zeroize = { version = "1", optional = true }

[dev-dependencies]
openh264 = "0.6"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "red_screen"
required-features = ["discovery"]

[[test]]
name = "pixel_verify"
required-features = ["dangerous-unverified"]
