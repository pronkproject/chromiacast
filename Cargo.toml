[package]
name = "chromiacast"
version = "0.1.0"
edition = "2021"
description = "Cast streaming protocol (RTP/RTCP) for Rust"
license = "MIT"
repository = "https://github.com/pronkproject/chromiacast"
readme = "README.md"
rust-version = "1.83"
keywords = ["cast", "chromecast", "streaming", "rtp", "rtcp"]
categories = ["multimedia", "network-programming"]

[dependencies]
aes = "0.8"
bytes = "1"
ctr = "0.9"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time", "sync", "rt", "macros", "io-util"] }
zeroize = ">=1, <1.9"
