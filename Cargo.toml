[package]
name = "chromiacast"
version = "0.1.0"
edition = "2021"
description = "Cast streaming protocol (RTP/RTCP) for Rust"
license = "MIT"
repository = "https://github.com/pronkproject/chromiacast"
readme = "README.md"
